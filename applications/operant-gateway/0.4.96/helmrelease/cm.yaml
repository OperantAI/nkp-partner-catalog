---
apiVersion: v1
data:
  values.yaml: |
    # Operant Gateway uses the gateway config from a Secret created in the namespace.
    # MCP Config - By default uses a ConfigMap with blank template
    # Set useConfigSecret: true to use a custom secret instead
    # kubectl create secret generic operant-gateway --from-file=operant_mcp_gateway.json -n <namespace>
    # The JSON file should contain:
    # {
    #   "gateway": {
    #     "user_email": "user@example.com",
    #     "operant_token": "",
    #     "team_name": "your-team",
    #     "service_name": "mcp-gateway",
    #     "gatekeeper_url": ""
    #   },
    #   "mcp_servers": [...]
    # }

    # # Gateway configuration
    # # These values will automatically populate the ConfigMap when useConfigSecret is false
    # gateway:
    #   user_email: "setup@email"
    #   team_name: "SOC"
    #   # operant_token: ""  # Can be set here or via env.OPERANT_TOKEN
    #   service_name: ""
    #   mcp_servers: []  # Array of MCP server configurations

    # env:
    #   OPERANT_TOKEN: "XXX" # REQUIRED: User must set Operant API token

    # # Gatekeeper service configuration
    # # The MCP gateway connects to the Operant Gatekeeper for security scanning
    # gatekeeper:
    #   # Full URL to the Operant Gatekeeper service
    #   url: "http://operant-lcp.${releaseNamespace}.svc:80"

kind: ConfigMap
metadata:
  name: ${releaseName}-${appVersion}-config-defaults
  namespace: ${releaseNamespace}
---
