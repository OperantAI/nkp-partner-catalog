overview: |-
  ## Overview

  Operant Gateway is a lightweight, flexible AI remote gateway that sits in front of your AI traffic. It proxies requests to upstream AI providers, routing every prompt and response through the Operant Local Control Plane (LCP) first, where prompts are analyzed and secured before the request reaches the AI provider.

  It also works as a remote MCP gateway for Model Context Protocol (MCP) servers, providing governance over which servers and tools are available to AI agents, and scanning each tool call before and after it executes.

  > **Requires the Operant Local Control Plane (operant-lcp) application to be installed and ready first.** Operant Gateway is deployed only after the Operant LCP is ready.

  ## Key Features

  - **AI Request Proxying:** Proxies requests to upstream AI providers through Operant for real-time prompt analysis and defense.
  - **Remote MCP Gateway:** Governs access to remote MCP servers and tools, controlling which are available to your AI agents.
  - **Tool Call Scanning:** Inspects every tool call before and after execution.
  - **Governance & Policy:** Enforces which servers, tools, and actions agents are allowed to use.

  ## Getting Started

  Operant Gateway requires the Operant LCP (`operant-lcp`) application running in the same namespace and Operant API keys from the Operant console. Request access at **[operant.ai](https://operant.ai)** and generate your Operant API keys.

  Authenticate to the registry with your Operant API keys:

  ```bash
  helm registry login -u OPERANT_KEY_ID -p OPERANT_KEY_SECRET registry.operant.ai
  ```

  ### 1. Create the Gateway config file

  ```bash
  cat > operant_mcp_gateway.json << 'EOF'
  {
    "gateway": {
      "user_email": "user@example.com",
      "operant_token": "token-here",
      "team_name": "your-team",
      "use_streamable_http": true,
      "gatekeeper_url": "http://operant-lcp.operant-system.svc.cluster.local:80",
      "service_name": ""
    }
  }
  EOF
  ```

  `gatekeeper_url` is the Kubernetes Service internal DNS name of the Operant LCP deployment — for example `http://operant-lcp.operant-system.svc.cluster.local:80` in the `operant-system` namespace.

  ### 2. Create a secret in the installation namespace

  ```bash
  kubectl create secret generic operant-gateway \
    --from-file=operant_mcp_gateway.json \
    -n operant-system
  ```

  ### 3. Install the Gateway chart

  ```bash
  helm install operant-gateway oci://registry.operant.ai/helm/operant-gateway \
    --set useConfigSecret=true \
    --set operantRegistry.username="OPERANT_KEY_ID" \
    --set operantRegistry.password="OPERANT_KEY_SECRET" \
    --namespace operant-system
  ```

  | Placeholder | Where it comes from |
  | --- | --- |
  | `OPERANT_KEY_ID`, `OPERANT_KEY_SECRET` | API keys from *Generate your Operant API Keys* |
  | `operant_token` | Service account token from *Register New Gatekeeper* |

