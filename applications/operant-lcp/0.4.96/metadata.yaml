overview: |-
  ## Overview

  Operant Local Control Plane (LCP) is deployed inside your Kubernetes perimeter for privacy, protecting your AI and agentic applications at runtime. It sits inline between your workloads and AI providers — analyzing every AI request and response for prompt injection, sensitive data, and secrets before a leak is materialized, with no sidecars, code changes, or application instrumentation.

  ## Features

  - **Live Comprehensive AI Catalogs:** Automatically updating catalogs of all AI workloads, AI agents, tools, models, and AI providers as AI usage grows across the organization (including providers such as OpenAI, Deepseek, Cohere, Anthropic, and Hugging Face).
  - **AI Security Graphs:** Maps the highest-risk data flows between AI workloads, agents, and AI APIs.
  - **OWASP AI Threat Detection:** Threat detection analytics for top OWASP risks including sensitive data leakage, API key and secrets leakage, prompt injection, and data poisoning risks in AI requests and responses.
  - **Deep Drill-Down Insights:** Entity-level insight into what types of data are being leaked (SSNs vs. credit card numbers vs. bank IDs vs. PHI) and which workloads and APIs leak them, with out-of-the-box mappings to the OWASP AI Top 10 threat vectors.
  - **Inline Threat Defense:** Blocks and auto-redacts prompt injections, secrets, and sensitive data leakage in AI requests and responses.
  - **Defense Analytics:** Shows which AI requests and responses were blocked or redacted by AI Gatekeeper.

  ## Getting Started

  Operant LCP requires Operant API keys and a Gatekeeper service account token from the Operant console. Request access at **[operant.ai](https://operant.ai)**, then generate your API keys and register a new Gatekeeper.

  Authenticate to the registry with your Operant API keys:

  ```bash
  helm registry login -u OPERANT_KEY_ID -p OPERANT_KEY_SECRET registry.operant.ai
  ```

  Install with the minimum options:

  ```bash
  helm install operant-lcp oci://registry.operant.ai/helm/operant-lcp \
    --set env.GATEKEEPER_NAME="GATEKEEPER_NAME" \
    --set env.OPERANT_TOKEN="OPERANT_SERVICE_ACCOUNT" \
    --set operantRegistry.username="OPERANT_KEY_ID" \
    --set operantRegistry.password="OPERANT_KEY_SECRET" \
    --set replicaCount=1 \
    --create-namespace --namespace operant-system
  ```

  | Placeholder | Where it comes from |
  | --- | --- |
  | `GATEKEEPER_NAME` | The name you chose for this Gatekeeper in Operant |
  | `OPERANT_SERVICE_ACCOUNT` | Service account token from *Register New Gatekeeper* |
  | `OPERANT_KEY_ID`, `OPERANT_KEY_SECRET` | API keys from *Generate your Operant API Keys* |

  After installation, open the Operant console to view your AI catalogs, security graphs, and AI Gatekeeper defense analytics.

